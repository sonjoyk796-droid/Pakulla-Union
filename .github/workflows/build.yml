name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libbz2-dev libsqlite3-dev
          pip install --upgrade buildozer cython==0.29.33

      - name: Fix buildozer.spec for GitHub
        run: |
          sed -i "s/^android.api.*/android.api = 33/" buildozer.spec || true
          sed -i "s/^android.minapi.*/android.minapi = 21/" buildozer.spec || true
          sed -i "s/^android.ndk.*/android.ndk = 25b/" buildozer.spec || true
          sed -i "s/^android.sdk.*/android.sdk = 33/" buildozer.spec || true
          sed -i "s/^#*android.build_tools.*/android.build_tools = 33.0.2/" buildozer.spec || true
          sed -i "s/^#*android.accept_sdk_license_agreements.*/android.accept_sdk_license_agreements = True/" buildozer.spec || true
          grep -q "android.accept_sdk_license_agreements" buildozer.spec || echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          grep -q "android.build_tools" buildozer.spec || echo "android.build_tools = 33.0.2" >> buildozer.spec
          cat buildozer.spec

      - name: Accept Licenses
        run: |
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.android/licenses/android-sdk-preview-license
          echo "y" > ~/.android/repositories.cfg

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pakulla-Union-APK
          path: bin/*.apk